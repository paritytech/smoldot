# Matrix of zombienet tests fanned out by `.github/workflows/zombienet.yml`.
#
# Fields:
#   job-name    — unique, human-readable identifier surfaced in GH UI/artifacts.
#   test        — name of the cargo integration-test binary (the `.rs` file stem
#                 under `e2e-tests/tests/`). Each test is its own binary.
#   runner-type — `default` or `large`; maps to ZOMBIENET_SDK_*_RUNNER_FOR_NATIVE.
#
# Adding a new test: drop a new `.rs` file under `e2e-tests/tests/` and add a
# matching entry here. No workflow or Cargo.toml edits required.

- job-name: "zombienet-smoldot-0001-statement_store_submission"
  test: "statement_store_submission"
  runner-type: "default"

- job-name: "zombienet-smoldot-0002-statement_store_reception"
  test: "statement_store_reception"
  runner-type: "default"

- job-name: "zombienet-smoldot-0003-statement_store_peer_connection"
  test: "statement_store_peer_connection"
  runner-type: "default"
