name: zombienet-e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Bump in sync with e2e-tests/chain-specs/people-westend-local-spec.json if the runtime diverges.
  POLKADOT_IMAGE: docker.io/parity/polkadot:stable2603
  CUMULUS_IMAGE: docker.io/parity/polkadot-parachain:stable2603

jobs:
  light-node-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache cargo registry + e2e-tests target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            e2e-tests/target
          key: e2e-cargo-${{ hashFiles('e2e-tests/Cargo.lock', 'lib/Cargo.toml') }}

      - name: Install smoldot JS deps
        run: npm ci
        working-directory: wasm-node/javascript

      - name: Install e2e-tests JS deps
        run: npm ci
        working-directory: e2e-tests/js

      - name: Extract polkadot + polkadot-parachain binaries
        # The docker provider's multiaddr is broken for host-side clients (it advertises the
        # container bridge IP with the host-mapped port, which is unroutable). Run native
        # instead: use Docker only as a delivery mechanism for versioned binaries.
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/bin"
          docker pull "$POLKADOT_IMAGE"
          docker pull "$CUMULUS_IMAGE"
          cid=$(docker create "$POLKADOT_IMAGE")
          docker cp "${cid}:/usr/bin/polkadot"                         "$GITHUB_WORKSPACE/bin/"
          docker cp "${cid}:/usr/lib/polkadot/polkadot-execute-worker" "$GITHUB_WORKSPACE/bin/"
          docker cp "${cid}:/usr/lib/polkadot/polkadot-prepare-worker" "$GITHUB_WORKSPACE/bin/"
          docker rm "${cid}"
          cid=$(docker create "$CUMULUS_IMAGE")
          docker cp "${cid}:/usr/local/bin/polkadot-parachain"         "$GITHUB_WORKSPACE/bin/"
          docker rm "${cid}"
          chmod +x "$GITHUB_WORKSPACE/bin/"*
          "$GITHUB_WORKSPACE/bin/polkadot" --version
          "$GITHUB_WORKSPACE/bin/polkadot-parachain" --version

      - name: Run e2e test
        env:
          ZOMBIE_PROVIDER: native
          RUST_LOG: info
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          cargo test --manifest-path e2e-tests/Cargo.toml --test light_node_submission -- --nocapture

      - name: Fix zombienet log permissions
        if: failure()
        run: sudo chown -R "$USER" /tmp/zombie-* /tmp/zombienet-* 2>/dev/null || true

      - name: Upload zombienet logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zombienet-logs
          path: |
            /tmp/zombie-*/**
            /tmp/zombienet-*/**
          if-no-files-found: ignore
          retention-days: 7
