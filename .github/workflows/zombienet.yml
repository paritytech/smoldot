name: zombienet-e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_pattern:
        description: "Regex over job-name to run a subset of tests."
        type: string
        default: ""
        required: false

concurrency:
  group: zombienet-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  preflight:
    uses: ./.github/workflows/zombienet-reusable-preflight.yml
    with:
      tests_yaml: .github/zombienet-tests/zombienet_smoldot_tests.yml
      test_pattern: ${{ inputs.test_pattern }}

  zombienet-smoldot-tests:
    name: ${{ matrix.test.job-name }}
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' || needs.preflight.outputs.changes_relevant == 'true' }}
    runs-on: ${{ matrix.test.runner-type == 'large' && needs.preflight.outputs.ZOMBIENET_SDK_LARGE_RUNNER || needs.preflight.outputs.ZOMBIENET_SDK_DEFAULT_RUNNER }}
    timeout-minutes: 40
    container:
      image: ${{ needs.preflight.outputs.ZOMBIENET_SDK_IMAGE }}
      options: -v /tmp/zombienet:/tmp/zombienet
    env:
      ZOMBIE_PROVIDER: ${{ needs.preflight.outputs.ZOMBIE_PROVIDER }}
      RUST_LOG: ${{ needs.preflight.outputs.RUST_LOG }}

    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.preflight.outputs.TEST_MATRIX) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@v6.1.0
        with:
          node-version: '22'

      - name: Install wasm target
        shell: bash
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry + e2e-tests target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            e2e-tests/target
          key: e2e-cargo-${{ hashFiles('e2e-tests/Cargo.lock', 'lib/Cargo.toml') }}

      - name: Cache smoldot JS node_modules
        uses: actions/cache@v4
        with:
          path: wasm-node/javascript/node_modules
          key: smoldot-js-nm-${{ hashFiles('wasm-node/javascript/package-lock.json') }}

      - name: Cache e2e-tests JS node_modules
        uses: actions/cache@v4
        with:
          path: e2e-tests/js/node_modules
          key: e2e-js-nm-${{ hashFiles('e2e-tests/js/package-lock.json') }}

      - name: Install smoldot JS deps
        shell: bash
        run: npm ci
        working-directory: wasm-node/javascript

      - name: Install e2e-tests JS deps
        shell: bash
        run: npm ci
        working-directory: e2e-tests/js

      # Pull binaries from the polkadot-sdk release rather than extracting
      # from a Docker image — running polkadot natively avoids the docker
      # provider's broken multiaddr advertisement (container bridge IP with
      # host-mapped port is unroutable for host-side clients like smoldot).
      - name: Run test
        uses: ./.github/actions/zombienet-smoldot
        with:
          polkadot-release-tag: ${{ needs.preflight.outputs.POLKADOT_RELEASE_TAG }}
          test-filter: ${{ matrix.test.test-filter }}

      - name: Upload zombienet logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zombienet-logs-${{ matrix.test.job-name }}-${{ github.sha }}
          path: |
            /tmp/zombie-*/**
            /tmp/zombienet-*/**
          if-no-files-found: ignore
          retention-days: 7
