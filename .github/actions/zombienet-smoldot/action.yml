name: "Run smoldot zombienet test"
description: "Downloads polkadot binaries from the pinned release and runs a single e2e test."

inputs:
  polkadot-release-tag:
    description: "polkadot-sdk release tag providing the polkadot / polkadot-parachain binaries."
    required: true
  test:
    description: "Cargo integration-test binary to invoke (`.rs` stem under `e2e-tests/tests/`)."
    required: true

runs:
  using: "composite"
  steps:
    - name: Download polkadot binaries from GitHub release
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.polkadot-release-tag }}
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/bin"
        base="https://github.com/paritytech/polkadot-sdk/releases/download/${RELEASE_TAG}"
        for bin in polkadot polkadot-execute-worker polkadot-prepare-worker polkadot-parachain; do
          echo "Downloading ${bin} from ${RELEASE_TAG}"
          curl -fL --retry 3 -o "$GITHUB_WORKSPACE/bin/${bin}" "${base}/${bin}"
          chmod +x "$GITHUB_WORKSPACE/bin/${bin}"
        done
        "$GITHUB_WORKSPACE/bin/polkadot" --version
        "$GITHUB_WORKSPACE/bin/polkadot-parachain" --version

    - name: Run e2e test
      shell: bash
      env:
        TEST: ${{ inputs.test }}
      run: |
        set -euo pipefail
        export PATH="$GITHUB_WORKSPACE/bin:$PATH"
        cargo test --locked --manifest-path e2e-tests/Cargo.toml \
          --test "$TEST" -- --nocapture
